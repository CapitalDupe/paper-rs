[workspace]
resolver = "2"
members = [
    "crates/paper-protocol",
    "crates/paper-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/CapitalDupe/paper-rs"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
