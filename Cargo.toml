[workspace]
resolver = "2"
members = [
    "crates/paper-jvm",
    "crates/paper-protocol",
    "crates/paper-server",
    "crates/paper-storage",
    "crates/paper-world",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/CapitalDupe/paper-rs"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
