name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting (advisory)
        run: cargo fmt --all -- --check || echo "::warning::Not rustfmt-formatted; the Auto-format workflow fixes this on branches."
      - name: Check workspace
        run: cargo check --workspace
      - name: Build Java test plugins
        run: bash scripts/build-test-plugins.sh
      - name: Test workspace
        env:
          PAPER_REQUIRE_JVM: "1"
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
